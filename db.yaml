services:
  CyberHub-S1_db:
    image: postgres:16
    container_name: CyberHub-Database
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - cyberhub-network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

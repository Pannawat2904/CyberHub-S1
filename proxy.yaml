include:
  - app.yaml

services:
  caddy:
    image: caddy:latest
    container_name: CyberHub-Caddy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - cyberhub-network
